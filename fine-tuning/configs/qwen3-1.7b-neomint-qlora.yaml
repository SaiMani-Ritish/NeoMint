# NeoMint QLoRA Training Configuration
# Base model: Qwen/Qwen3-1.7B
# Training method: QLoRA (4-bit quantized base, LoRA adapter)

model:
  base: "Qwen/Qwen3-1.7B"
  product_name: "NeoMint-Planner-1.7B"
  license: "Apache-2.0"
  context_length: 8192  # Qwen3 supports 32K; 8K is practical default

quantization:
  load_in_4bit: true
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true

lora:
  rank: 32
  alpha: 64  # 2x rank
  dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  bias: "none"
  task_type: "CAUSAL_LM"

training:
  num_epochs: 3
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4  # effective batch size = 8
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  max_grad_norm: 1.0
  max_seq_length: 2048  # most training examples are well under this
  logging_steps: 5
  save_strategy: "epoch"
  fp16: false
  bf16: true  # T4 supports bf16 via compute_dtype

data:
  train_file: "data/train.jsonl"
  validation_file: "data/validation.jsonl"
  test_file: "data/test.jsonl"
  schema_file: "schemas/action-plan.schema.json"
  manifest_file: "schemas/tool-manifest.json"

export:
  gguf_quantization: "Q4_K_M"
  output_filename: "neomint-planner-1.7b-Q4_K_M.gguf"
  merge_adapter: true  # merge LoRA before GGUF export

# Notes:
# - Start with 500-1000 examples for pipeline validation
# - Target 2000-5000 for the first serious adapter
# - Held-out test set: at least 300-500 cases
# - Do NOT measure success by training loss alone
