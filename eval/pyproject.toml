[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neomint-eval"
version = "0.1.0"
description = "NeoMint evaluation suite — benchmarks, fixtures, and reports"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sai Mani Ritish" }]

dependencies = [
    "pydantic>=2.7.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

agent = [
    "neomint-agent",
]

[project.scripts]
neomint-eval = "neomint_eval.runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
